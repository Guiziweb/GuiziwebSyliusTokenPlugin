sylius_grid:
    grids:
        guiziweb_sylius_token_admin_token_product:
            driver:
                name: doctrine/orm
                options:
                    class: "%sylius.model.product_variant.class%"
                    repository:
                        method: ["expr:service('guiziweb_sylius_token.repository.token_product')", 'createPackListQueryBuilder']
                        arguments: ["expr:service('sylius.context.locale').getLocaleCode()"]
            sorting:
                tokenAmount: desc
            limits: [10, 25, 50]
            fields:
                name:
                    type: twig
                    label: sylius.ui.name
                    path: .
                    options:
                        template: "@GuiziwebSyliusTokenPlugin/admin/token_product/grid/field/name.html.twig"
                tokenAmount:
                    type: string
                    label: guiziweb_sylius_token.form.product_variant.token_amount
                    path: tokenAmount
                    sortable: ~
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code, translation.name]
            actions:
                main:
                    create_pack:
                        type: default
                        label: guiziweb_sylius_token.ui.create_pack
                        icon: 'tabler:plus'
                        options:
                            link:
                                route: guiziweb_sylius_token_admin_token_product_create
                item:
                    update:
                        type: update
                        options:
                            link:
                                route: guiziweb_sylius_token_admin_token_product_update
                                parameters:
                                    id: resource.product.id
