# Delete these routes and define your own shop routes here

guiziweb_sylius_token_static_welcome:
    path: /static-welcome/{name}
    defaults:
        _controller: Guiziweb\SyliusTokenPlugin\Controller\GreetingController::staticallyGreetAction
        name: ~

guiziweb_sylius_token_dynamic_welcome:
    path: /dynamic-welcome/{name}
    defaults:
        _controller: Guiziweb\SyliusTokenPlugin\Controller\GreetingController::dynamicallyGreetAction
        name: ~
